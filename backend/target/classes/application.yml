server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    secret: "change-this-secret-key-change-this-secret-key-change-this-secret-key"
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
